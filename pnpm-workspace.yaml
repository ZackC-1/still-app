packages:
  - "packages/*"

# Supply-chain "release-age cooldown": some runners enforce a 1-day minimumReleaseAge,
# which rejects any dependency published within the last 24h, such as a same-day Svelte/WXT patch.
# We disable the age heuristic here: the lockfile already pins exact versions and integrity hashes,
# and branch protection plus secret scanning are the enforced guardrails.
# Revisit if a stricter supply-chain posture is wanted.
minimumReleaseAge: 0

# esbuild needs its postinstall to fetch the platform binary (used by Vite/WXT/Vitest).
# spawn-sync is a transitive build helper; harmless to allow.
allowBuilds:
  esbuild: true
  spawn-sync: true

# ext-firefox is a reserved package slot; the current Firefox build is produced from ext-chromium.
