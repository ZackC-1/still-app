name: Supabase security rehearsal

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/backend/**"
      - ".github/workflows/supabase-security-rehearsal.yml"
      - ".github/workflows/security-audit.yml"
      - ".github/workflows/supabase-readonly-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-security-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-readonly-checks:
    name: Read-only QA check route (disposable database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Disposable runner only; no environment, provider credentials or deployment authority.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.3"
      - uses: supabase/setup-cli@v3
        with:
          version: "2.119.0"
      - name: Verify pinned tooling
        run: test "$(supabase --version)" = '2.119.0'
      - name: Install pinned age (checksum verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/age.tgz" \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age"
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP/age" age/age age/age-keygen
      - name: Session proof, keyed production digest and report encryption round trip (no database)
        run: |
          export STILL_QA_AGE_BIN="$RUNNER_TEMP/age/age/age" STILL_QA_AGE_KEYGEN="$RUNNER_TEMP/age/age/age-keygen"
          deno test --frozen --config supabase/functions/deno.json --allow-env=STILL_QA_AGE_BIN,STILL_QA_AGE_KEYGEN,TMPDIR \
            --allow-run="$STILL_QA_AGE_BIN,$STILL_QA_AGE_KEYGEN" --allow-read --allow-write scripts/backend/qa-checks/run.test.ts
      - name: Install the candidate twice and run every check as the narrow role
        run: bash scripts/backend/rehearse-qa-readonly-checks.sh
      - name: Failure/cancellation cleanup
        if: always()
        run: supabase stop --project-id still-app --no-backup
  qa-sandbox:
    name: Fixed sandbox SQL isolation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Separate disposable runner; no environment, provider credentials or deployment authority.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.3"
      - uses: supabase/setup-cli@v3
        with:
          version: "2.119.0"
      - name: Verify pinned tooling and bind exact synthetic source
        id: plan
        run: |
          test "$(supabase --version)" = '2.119.0'
          revision=$(git rev-parse HEAD)
          digest=$(node scripts/backend/plan.mjs create "$revision" synthetic-github-runner "$RUNNER_TEMP/u1-plan.json")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "QA SQL synthetic target; revision $revision; plan SHA-256 $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Rehearse upgrade, clean install and preserving emergency restore
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
        run: bash scripts/backend/rehearse-qa-sandbox.sh "$REVISION" "$PLAN_DIGEST"
      - name: Verify existing production Edge composition against new SQL wrappers
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
          STILL_ACCESS_REHEARSAL_VERSION: "0021"
        run: bash scripts/backend/rehearse-access.sh "$REVISION" "$PLAN_DIGEST"
      - name: Failure/cancellation cleanup
        if: always()
        run: supabase stop --project-id still-app --no-backup
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No environments, provider credentials, production secrets or write permissions.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.3"
      - uses: supabase/setup-cli@v3
        with:
          version: "2.119.0"
      - name: Test immutable plan boundary
        run: node --test scripts/backend/plan.test.mjs scripts/backend/entrypoints.test.mjs scripts/backend/hardening-candidate.test.mjs scripts/backend/access-runtime.test.mjs scripts/backend/apple-publication.test.mjs
      - name: Focused audit and alert boundaries
        run: |
          deno test --frozen --config supabase/functions/deno.json supabase/tests/access_served_proof_test.ts
          deno test --config supabase/functions/deno.json scripts/backend/audit.test.ts
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/backend -p 'test_*.py'
      - name: Verify audit certificate and hostname checks with disposable TLS endpoints
        run: deno test --config supabase/functions/deno.json --allow-env=PGHOST,PGPORT,PGUSERNAME,PGUSER,PGDATABASE,PGPASSWORD,PGSSL,PGSSLNEGOTIATION,PGIDLE_TIMEOUT,PGCONNECT_TIMEOUT,PGMAX_LIFETIME,PGMAX_PIPELINE,PGBACKOFF,PGKEEP_ALIVE,PGDEBUG,PGFETCH_TYPES,PGPUBLICATIONS,PGTARGET_SESSION_ATTRS,PGTARGETSESSIONATTRS,PGAPPNAME --allow-run=openssl --allow-read=/tmp --allow-write=/tmp '--allow-net=localhost,127.0.0.1,[::1]' scripts/backend/audit-connection.test.ts
      - name: Verify pinned CLI and runtime
        run: |
          test "$(supabase --version)" = '2.119.0'
          deno --version
          sha256sum "$(command -v supabase)" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the exact synthetic operation
        id: plan
        run: |
          revision=$(git rev-parse HEAD)
          digest=$(node scripts/backend/plan.mjs create "$revision" synthetic-github-runner "$RUNNER_TEMP/u1-plan.json")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Synthetic target; revision $revision; plan SHA-256 $digest" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/u1-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Create, migrate, test and destroy isolated synthetic database
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
        run: |
          bash scripts/backend/rehearse.sh "$REVISION" "$PLAN_DIGEST"
          bash scripts/backend/rehearse-access.sh "$REVISION" "$PLAN_DIGEST"
      - name: Failure/cancellation cleanup
        if: always()
        run: supabase stop --project-id still-app --no-backup
