name: CI

# Public trust gate for code and documentation changes. Deployment remains separate:
# Supabase, Apple, and store portal steps are human-gated in docs/CONNECTIONS.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Disable the release-age cooldown at the workflow level too. If the runner injects this as an
# env var it would override pnpm-workspace.yaml, so we pin it to 0 here as well. See the rationale
# in pnpm-workspace.yaml.
env:
  NPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

jobs:
  check:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from package.json "packageManager" (pnpm@11.9.0).
      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (produces both extension dist/ folders)
        run: pnpm build

  functions:
    name: Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install function deps
        working-directory: supabase/functions
        run: deno install
      - name: Lint
        working-directory: supabase/functions
        run: deno lint
      - name: Typecheck entrypoints
        working-directory: supabase/functions
        run: deno check */index.ts
      - name: Test handlers (faked payloads + mocked stores — no Apple, no live DB)
        working-directory: supabase/functions
        run: deno test

  e2e:
    name: Playwright on fixtures
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Detect Playwright harness
        id: detect
        run: |
          if [ -f playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright harness not present yet (added in U16) — skipping e2e."
          fi

      - uses: pnpm/action-setup@v6.0.9
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build extensions
        if: steps.detect.outputs.present == 'true'
        run: pnpm build

      - name: Install Playwright Chromium
        if: steps.detect.outputs.present == 'true'
        # Exit 100 here is apt (--with-deps), not the browser CDN: a stale package index on
        # some runner images 404s persistently — it killed 5+ CI runs on 2026-07-07 alone and
        # survives in-job retries without a refresh. Update the index first, then retry with
        # backoff before failing the job.
        run: |
          # packages.microsoft.com intermittently serves corrupt InRelease files from some Azure
          # CDN edges ("Clearsigned file isn't valid, got 'NOSPLIT'"), which fails EVERY apt
          # operation on the affected runner with exit 100 — retries included. Playwright's system
          # deps all come from the Ubuntu archives, so drop Microsoft's repos entirely.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $i); retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          exit 1

      - name: Run Playwright fixture tests (gating)
        if: steps.detect.outputs.present == 'true'
        run: pnpm exec playwright test --project=fixtures

      # The real-site smoke layer is intentionally NOT run here — it is non-gating
      # and lives in a separate, retry-allowed job (KTD10). It must never block merge.
