name: StillKit Swift

# Optional check: runs StillKit's Swift tests on a macOS runner. It is not a required check.
on:
  pull_request:
    paths:
      - 'apps/apple/StillKit/**'
      - 'apps/apple/Still/**'
      - 'packages/shared-types/src/entitlement.ts'
      - 'packages/shared-types/fixtures/**'
      - 'tests/access-proof/**'
      - '.github/workflows/stillkit-swift.yml'
  push:
    branches: [main]
    paths:
      - 'apps/apple/StillKit/**'
      - 'apps/apple/Still/**'
      - 'packages/shared-types/src/entitlement.ts'
      - 'packages/shared-types/fixtures/**'
      - 'tests/access-proof/**'
      - '.github/workflows/stillkit-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stillkit-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: StillKit swift test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No SwiftPM cache: the package has no dependencies, so there is nothing worth caching.
      # Uses the runner's default Xcode (Swift 6.0 or later; the package's tools version is 6.0).
      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: swift test
        run: swift test --package-path apps/apple/StillKit

      - name: swift build
        run: swift build --package-path apps/apple/StillKit
