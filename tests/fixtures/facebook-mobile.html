    <!-- A small stylesheet reproducing the captured computed styles (Facebook's own class names
         and stylesheet are not copied): every box is a relative flex column at z-index 0 and
         paints its background with a ::before that fills it (z-index -1). The light colours are
         the captured computed values; html.dark swaps in modelled dark colours (not captured),
         used only for screenshots. -->
    <style>
      :root { --page: rgb(188, 192, 196); --card: rgb(255, 255, 255); --line: rgb(201, 204, 209); --icon: rgb(101, 103, 107); --active: rgb(24, 119, 242); --badge: rgb(221, 35, 52); }
      html.dark { --page: rgb(24, 25, 26); --card: rgb(36, 37, 38); --line: rgb(62, 64, 66); --icon: rgb(176, 179, 184); --active: rgb(45, 136, 255); }
      .m { display: flex; flex-direction: column; position: relative; box-sizing: border-box; }
      .bg::before { content: ""; position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
      .page::before { background: var(--page); } .card::before { background: var(--card); }
      .line::before { background: var(--line); } .badge::before { background: var(--badge); border-radius: 50px; }
      .row { display: flex; flex-direction: row; justify-content: center; align-items: center; width: 100%; height: 100%; }
      .glyph { display: inline-block; width: 28px; height: 28px; border-radius: 50%; border: 3px solid currentColor; box-sizing: border-box; }
      .count { display: block; text-align: center; color: #fff; font: 600 12px/16px sans-serif; }
    </style>
  </head>

    <!-- The mobile tab bar keeps a fixed number of slots, so the Reels tab's contents are hidden
         rather than the tab itself, which would otherwise leave a grey gap (issue #58). The packaged
         layout then makes the tab invisible and untappable and widens the other five to a fifth of
         the bar each, so it shows no empty slot and no bare ends (ISS-0102). -->
    <!-- The top bar, captured read-only on 21 Oct 2026 (m.facebook.com signed in, Chromium with an
         iPhone user agent at 390 px; roles, data-* attribute names, nesting, inline geometry and
         computed light-theme colours only, no text or ids).
         Captured: the tab list is a transparent relative flex column 390 px wide and the grey
         beside the tabs is the page's own background (an ancestor's ::before, rgb(188, 192, 196)).
         Each tab is a sixth of the bar, placed by inline width and margin-left and pulled up into
         one row by margin-top:-50px, and paints its white box with a ::before. Inside, four layers
         as wide as the tab are stacked the same way: the icon layer (a 29 px icon box 18 px in,
         its glyph centred by flex), the 2 px line under the bar (painted by that layer's ::before,
         rgb(201, 204, 209)), and two badge layers (a 26 px pill 31-32 px in; the first layer's
         small dot is hidden unless used). The selected tab only colours its icon; there is no
         separate active underline.
         Modelled: the glyph (Facebook draws an icon-font character about 28.8 x 28 px; here a
         28 px ring, so roundness shows), the badge counts (invented), the hidden dot layer (left
         empty), and the dark colours. The owner's screenshot of 2.1.1.420 (21 Oct) is the visual
         reference for the grey bands at the ends. -->
