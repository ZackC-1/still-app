<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Instagram — fixture</title>
  </head>
  <body>
    <!-- Sidebar nav: a Reels item (ig-nav, hide) + a normal item (must survive) -->
    <nav id="sidebar">
      <a href="/" id="home-link">Home</a>
      <a href="/reels/" id="reels-link"><svg aria-label="Reels"></svg> Reels</a>
    </nav>

    <!-- Home feed: an inline Reel (ig-inline, remove) + a normal post (must survive) -->
    <main>
      <article id="reel-post"><a href="/reel/xyz">a reel</a></article>
      <article id="keep-post">A normal photo post</article>
    </main>

    <!--
      Profile grid. A profile's own Reels are /<username>/reel/<id>/, not /reel/<id>/, so a rule
      anchored to the start of the address never matched them (ig-explore-search, remove). The tile
      is a Reel because it carries the Clip badge, which is what tells it apart from a photo post.
    -->
    <div id="profile-grid">
      <a id="profile-reel-tile" href="/someuser/reel/ABC123/"><svg aria-label="Clip"></svg>a profile reel</a>
      <a id="keep-profile-post-tile" href="/someuser/p/XYZ789/">A normal grid photo</a>
      <!-- Over-blocking control: a profile whose username merely begins with the letters "reel". -->
      <a id="keep-profile-lookalike" href="/reelmaker/">Reelmaker</a>
    </div>
  </body>
</html>
