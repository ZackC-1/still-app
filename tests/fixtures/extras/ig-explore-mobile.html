<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic Instagram Explore and Search (mobile)</title>
  </head>
  <body>
    <!--
      Synthetic structural model for instagram.explore on the phone layout, where Search and
      Explore are one combined entry that must stay. UNVERIFIED CANDIDATE, mirroring the phone-width
      search entry seen on 2026-10-19 (ISS-0087): the main column holds a nav with the search
      field (a plain text input, no form) and the suggestions shown while typing, then a box of
      recommended tiles nested in rows. Invented text and handles only.
    -->
    <nav id="keep-tabbar">
      <a href="/" id="keep-tab-home">Home</a>
      <a href="/explore/" id="keep-tab-search-explore" aria-label="Search and Explore">Search and Explore</a>
      <a href="/direct/inbox/" id="keep-tab-messages">Messages</a>
    </nav>
    <main role="main">
      <nav id="keep-mobile-search">
        <div>
          <div><input id="keep-mobile-search-input" type="text" placeholder="Search" aria-label="Search input" /></div>
          <div id="keep-mobile-results">
            <ul>
              <li><a href="/explore/search/keyword/?q=invented">invented</a></li>
              <li><a href="/inventeduser/">inventeduser</a></li>
            </ul>
          </div>
        </div>
      </nav>
      <div id="target-mobile-explore-grid">
        <div>
          <div><div><a href="/p/InvD4/">Invented mobile tile one</a></div></div>
          <div><div><a href="/reel/InvE5/">Invented mobile tile two</a></div></div>
        </div>
      </div>
    </main>
  </body>
</html>
