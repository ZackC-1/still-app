<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic mobile YouTube autoplay preservation</title>
  </head>
  <body>
    <!-- Synthetic mobile preservation fixture. #movie_player and its html5-main-video were
         observed on public m.youtube.com with a phone viewport on 2026-10-08. The countdown
         and Cancel classes are existing UNVERIFIED candidates: the inspected browser could
         not play that video. These event tests do not prove live mobile autoplay prevention. -->
    <ytm-app>
    <div id="movie_player" class="html5-video-player">
      <video class="html5-main-video" id="player-video"></video>
      <div class="ytp-autonav-endscreen-countdown-overlay" id="keep-autonav-overlay">
        <span>Up next in 8</span>
        <button class="ytp-autonav-endscreen-upnext-cancel-button" id="keep-autonav-cancel">Cancel</button>
        <a href="/watch?v=inv300002" id="keep-autonav-next">Invented up next video</a>
      </div>
      <button class="ytp-autonav-toggle-button" id="keep-autoplay-toggle" aria-checked="true">Autoplay</button>
    </div>
    <div id="keep-playlist-panel">
      <a href="/watch?v=inv300003&amp;list=PLinvented03&amp;index=2" id="keep-playlist-next">Invented playlist item two</a>
    </div>
    </ytm-app>
    <script>
      // Records what a dormant build must leave alone. "loads" counts document loads in this tab
      // through sessionStorage, so a reload or a back-and-forward bounce to the same URL still
      // shows up; "token" is unique to this document's lifetime. "ended" counts the scripted
      // video "ended" event at its target, which proves the event really fired.
      const loads = Number(sessionStorage.getItem("autoplayProbeLoads") || "0") + 1;
      sessionStorage.setItem("autoplayProbeLoads", String(loads));
      window.__autoplayProbe = { toggleClicks: 0, cancelClicks: 0, ended: 0, loads, token: Math.random().toString(36).slice(2) };
      document.getElementById("keep-autoplay-toggle").addEventListener("click", () => window.__autoplayProbe.toggleClicks++);
      document.getElementById("keep-autonav-cancel").addEventListener("click", () => window.__autoplayProbe.cancelClicks++);
      document.getElementById("player-video").addEventListener("ended", () => window.__autoplayProbe.ended++);
      window.fireEnded = () => document.getElementById("player-video").dispatchEvent(new Event("ended"));
    </script>
  </body>
</html>
