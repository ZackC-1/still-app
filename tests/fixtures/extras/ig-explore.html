<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic Instagram Explore and Search (desktop)</title>
  </head>
  <body>
    <!--
      Synthetic structural model for instagram.explore (CP-077). Invented text and handles only.
      UNVERIFIED CANDIDATE, mirroring the desktop search entry seen signed in on 2026-10-19
      (ISS-0087): the main column holds the search field's box (a plain text input, no form), a
      spacer, then a box of recommended /p/ and /reel/ tiles nested in rows. The tiles hide only
      on the no-query search entry (/explore/search/); on tag, location and other pages that
      reuse this fixture they stay. The left-nav Search panel, its input and results are never
      targets (ids "keep-*").
    -->
    <nav id="keep-nav">
      <a href="/" id="keep-nav-home">Home</a>
      <a href="/explore/" id="target-nav-explore">Explore</a>
      <button id="keep-nav-search" aria-label="Search">Search</button>
    </nav>
    <section id="keep-search-panel" role="dialog" aria-label="Search">
      <input id="keep-search-input" type="text" placeholder="Search" aria-label="Search input" />
      <ul id="keep-search-results">
        <li><a href="/inventeduser/">inventeduser</a></li>
        <li><a href="/explore/tags/inventedtag/">#inventedtag</a></li>
        <li><a href="/explore/locations/900000001/invented-place/">Invented Place</a></li>
      </ul>
      <p id="keep-search-empty" hidden>No results found.</p>
    </section>
    <main role="main">
      <div>
        <div id="keep-entry-search">
          <div><div><input id="keep-entry-search-input" type="text" placeholder="Search" aria-label="Search input" /></div></div>
        </div>
        <div></div>
        <div id="target-explore-grid">
          <div>
            <div><div><a href="/p/InvA1/">Invented tile one</a></div></div>
            <div><div><a href="/p/InvB2/">Invented tile two</a></div></div>
            <div><div><a href="/reel/InvC3/">Invented tile three</a></div></div>
          </div>
        </div>
      </div>
      <div id="keep-popular-link"><a href="/popular/">Popular</a></div>
      <div id="keep-tag-page"><a href="/explore/tags/inventedtag/">#inventedtag page</a></div>
    </main>
  </body>
</html>
