<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic Facebook desktop right column</title>
  </head>
  <body>
    <!--
      Synthetic structural model for facebook.sponsored (CP-083, design id sidebar_ads): only the
      right-column ad block, by a structural anchor (to verify, H-014). UNVERIFIED CANDIDATE,
      mirroring the desktop Home seen signed in on 2026-10-19 (ISS-0088): the Sponsored heading, the
      ads and their divider share one box beside the Birthdays box, several boxes deep in the
      column; each ad's outbound link goes through Facebook's l.facebook.com redirect with
      rel=nofollow. Contacts, birthdays, group chats, sponsored feed posts and organic links with
      ad-like query strings stay. No text or letter detection. Invented text only.
    -->
    <div role="main"><div id="keep-feed">
      <div id="keep-sponsored-feed-post"><a href="/inventedpage/posts/900000000201">An invented sponsored feed post</a>
        <a href="https://l.facebook.com/l.php?u=https%3A%2F%2Fads.invented.example%2Ffeed" rel="nofollow">Invented feed ad link</a></div>
    </div></div>
    <div role="complementary" id="right-column">
      <div>
        <div>
          <div id="keep-column-stack">
            <div id="target-sidebar-ad-block" data-visualcompletion="ignore-late-mutation">
              <div>
                <div><h3>Sponsored</h3></div>
                <div>
                  <div id="target-sidebar-ad-1"><div><div>
                    <a href="https://l.facebook.com/l.php?u=https%3A%2F%2Fads.invented.example%2Fone" rel="nofollow" target="inventedad"><span>Invented ad one</span> <span>ads.invented.example</span></a>
                    <div role="button" tabindex="0" aria-label="Invented ad options">Options</div>
                  </div></div></div>
                  <div id="target-sidebar-ad-2"><div><div>
                    <a href="https://ads.invented.example/click?id=ad2" rel="nofollow"><span>Invented ad two</span></a>
                  </div></div></div>
                </div>
                <div class="divider"></div>
              </div>
            </div>
            <div id="keep-birthdays"><div><h3>Birthdays</h3></div><div><a href="/events/birthdays/">Invented birthdays</a></div></div>
          </div>
          <div id="keep-contacts" role="region" aria-label="Contacts">
            <a href="/inventedcontact1/">Invented contact one</a>
            <a href="/inventedcontact2/">Invented contact two</a>
          </div>
          <div id="keep-group-chats"><a href="/messages/t/900000000202/">Invented group chat</a></div>
        </div>
      </div>
    </div>
    <p id="keep-organic-links"><a href="/inventedpage/?utm_source=ad&amp;fbclid=inventedclick">Organic link with an ad-like query</a>
       <a href="/inventedpage/?ref=sponsored" id="keep-organic-link-two">Organic link two</a></p>
  </body>
</html>
