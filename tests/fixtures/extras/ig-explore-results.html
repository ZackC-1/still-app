<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic Instagram keyword and hashtag results</title>
  </head>
  <body>
    <!--
      Synthetic structural model for instagram.explore (CP-077): a deliberate keyword or hashtag
      RESULTS page (/explore/search/keyword/?q=...), where tag pages land per V3-D-045. Modelled
      with the same shape as the no-query search entry (a search field's box, then a box of /p/
      and /reel/ tiles), so a structural Explore hide that ignores the address would wrongly hide
      these results. (On 2026-10-19 the desktop results page showed a heading instead of the
      field; the phone layout keeps the field.) UNVERIFIED CANDIDATE structure; nothing here is
      ever a target. Invented text and handles only.
    -->
    <nav id="keep-tabbar">
      <a href="/" id="keep-tab-home">Home</a>
      <a href="/explore/" id="keep-tab-search-explore" aria-label="Search and Explore">Search and Explore</a>
    </nav>
    <main role="main">
      <nav id="keep-results-search"><div><input id="keep-results-search-input" type="text" value="#inventedtag" aria-label="Search input" /></div></nav>
      <div id="keep-results-grid">
        <div>
          <div><a href="/p/InvR1/">Invented result one</a></div>
          <div><a href="/reel/InvR2/">Invented result two</a></div>
          <div><a href="/p/InvR3/">Invented result three</a></div>
        </div>
      </div>
    </main>
  </body>
</html>
