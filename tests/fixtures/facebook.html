<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Facebook — fixture</title>
  </head>
  <body>
    <!-- Left menu: a Reels shortcut (fb-left-menu, hide) + normal items (must survive) -->
    <nav id="left-menu">
      <!--
        The Reels shortcut as it appears outside a list item, which is what the rule below the list
        is for. Two different things are being represented here and they are worth separating.

        Confirmed: Facebook labels this shortcut exactly "Reels", checked on a signed-in page. That
        is the load-bearing fact, because it is what lets the rule be an exact label match rather
        than a substring one.

        Assumed: the address. A query string is used here so that no address selector can reach the
        link and only the label can hide it, which is the case worth testing. The exact "?s=ptl" is
        a plausible stand-in rather than a recorded shape, since the left menu is only visible when
        signed in and no capture of it exists. No rule reads the address, so nothing depends on it.
      -->
      <a href="/reel/?s=ptl" id="reels-shortcut-by-label" aria-label="Reels">Reels</a>
      <ul>
        <li id="keep-menu-home"><a href="/" id="home-link">Home</a></li>
        <li id="menu-reels"><a href="/reel/" id="reels-shortcut" aria-label="Reels">Reels</a></li>
        <!--
          Over-blocking control: a Page whose name begins with the letters "reel". Facebook's own
          Reels URLs are always /reel/<id> or /reels/..., so the trailing slash is what tells a Reel
          apart from a Page called "Reel Estate".
        -->
        <li id="keep-menu-lookalike"><a href="/reelestate">Reel Estate Group</a></li>
        <!--
          Over-blocking control for the Page-tab rule below: an ordinary link to a Page whose vanity
          address happens to be "reels_tab". The rule keys on the tab, not on the word, so this link
          survives.
        -->
        <li id="keep-menu-reels-tab-page"><a href="/reels_tab">Reels Tab Productions</a></li>
      </ul>
    </nav>

    <!--
      Page profile tabs. Every Facebook Page and profile carries a Reels tab pointing at
      /<page>/reels_tab (fb-page-tabs, hide); the other tabs must survive. The markup is the shape
      recorded on signed-in Pages on 2026-09-24 (class names dropped): an <a role="tab"> with an
      absolute address whose label is wrapped in a div, never a bare text node.
    -->
    <div role="tablist" id="page-tabs">
      <a role="tab" aria-hidden="false" aria-selected="true" tabindex="0" href="/stillapp/" id="keep-page-posts-tab"
        ><div><span dir="auto">All</span><div></div></div><div role="none"></div
      ></a>
      <a
        role="tab"
        aria-hidden="false"
        aria-selected="false"
        tabindex="0"
        href="https://www.facebook.com/stillapp/reels_tab"
        id="page-reels-tab"
        ><div><span dir="auto">Reels</span><div></div></div><div role="none"></div
      ></a>
      <a
        role="tab"
        aria-hidden="false"
        aria-selected="false"
        tabindex="0"
        href="https://www.facebook.com/stillapp/photos"
        id="keep-page-photos-tab"
        ><div><span dir="auto">Photos</span><div></div></div><div role="none"></div
      ></a>
    </div>
    <!--
      A model of Facebook's tab-overflow contract, observed live and reproduced in Chromium, WebKit
      and Firefox: a tab with no layout box counts as overflowed. Facebook then strips its address,
      marks it aria-hidden and disabled, and offers it in the row's "More" menu instead; once the
      tab has a box again it is restored. Hiding the tab itself with display:none therefore made it
      flip between the two states every frame, visible in half of them. This is a synthetic model
      of that behavior, not Facebook's code.
    -->
    <script>
      (() => {
        const observer = new IntersectionObserver((entries) => {
          for (const { target, isIntersecting } of entries) {
            if (!isIntersecting && target.hasAttribute("href")) {
              target.dataset.href = target.getAttribute("href");
              target.removeAttribute("href");
              target.setAttribute("aria-hidden", "true");
              target.setAttribute("aria-disabled", "true");
              target.setAttribute("tabindex", "-1");
            } else if (isIntersecting && target.dataset.href) {
              target.setAttribute("href", target.dataset.href);
              delete target.dataset.href;
              target.setAttribute("aria-hidden", "false");
              target.removeAttribute("aria-disabled");
              target.setAttribute("tabindex", "0");
            }
          }
        });
        for (const tab of document.querySelectorAll('#page-tabs a[role="tab"]')) observer.observe(tab);
      })();
    </script>
    <!--
      The tab row's "More" menu, as Facebook renders it when the window is too narrow for the Reels
      tab (recorded: at 480px Followers moved here the same way). Only the Reels entry goes.
    -->
    <div role="menu" id="page-tabs-more-menu">
      <a role="menuitemradio" aria-checked="false" href="https://www.facebook.com/stillapp/reels_tab" id="page-more-reels"
        ><span dir="auto">Reels</span></a
      >
      <a role="menuitemradio" aria-checked="false" href="https://www.facebook.com/stillapp/live_videos" id="keep-page-more-live"
        ><span dir="auto">Live</span></a
      >
    </div>

    <!--
      Over-blocking control for the address rule. Facebook keeps its own sections in the first path
      segment, so an address like /groups/reels or /hashtag/reels is a section of Facebook rather
      than a Page's Reels tab. facebook.com/groups/reels is a live group that auctions fishing rods,
      reels and tackle. Those addresses must load exactly as they do with Still switched off, so the
      tests navigate to them and expect this block, not Still's page.
    -->
    <section id="keep-section-page">
      <h1 id="keep-section-title">Fishing rods, reels and tackle</h1>
      <div role="article" id="keep-section-post">A rod and reel auction listing</div>

      <!--
        The people directory at facebook.com/public/reels, which lists everyone whose name contains
        the word Reels. Copied in shape from the live page: each result is a link whose accessible
        name is the person's own name, wrapping their photo, addressed under /people/.

        This is the control for the narrowing above. A rule that hid any link merely labelled with
        the word "Reels" matched all of these. Measured on the live page, which carries 120 links in
        total: 26 matched, every one of them a photo link, covering 13 people listed twice each. The
        page read as a list of names with no pictures. Names of this shape are the reason the rule
        now matches the exact label and nothing else.
      -->
      <div id="keep-directory">
        <a
          id="keep-directory-person-one"
          role="presentation"
          aria-label="Reels Kapoor"
          href="https://www.facebook.com/people/Reels-Kapoor/pfbid0Ex4mPle1"
          ><img id="keep-directory-photo-one" alt="Reels Kapoor" src="data:,"
        /></a>
        <a
          id="keep-directory-person-two"
          role="presentation"
          aria-label="TJ Reels"
          href="https://www.facebook.com/people/TJ-Reels/pfbid0Ex4mPle2"
          ><img id="keep-directory-photo-two" alt="TJ Reels" src="data:,"
        /></a>
        <a
          id="keep-directory-person-three"
          role="presentation"
          aria-label="Dana 's Reels"
          href="https://www.facebook.com/people/Dana-s-Reels/pfbid0Ex4mPle3"
          ><img id="keep-directory-photo-three" alt="Dana 's Reels" src="data:,"
        /></a>
      </div>
    </section>

    <!-- Feed: a Reel article (fb-feed, remove) + normal posts (must survive) -->
    <main role="feed">
      <!--
        The home feed's Reels shelf card, in the shape recorded on 2026-09-24 (class names and
        creator names dropped). fb-watch removes each tile, which used to leave the card behind as
        a header reading "Reels" with nothing under it; fb-feed-shelf hides the card itself. The
        card is exactly four levels above the grid Facebook labels "Reels".
      -->
      <div id="reels-shelf-card">
        <div>
          <div>
            <div>
              <div role="button"><div><span id="reels-shelf-header">Reels</span></div></div>
              <h3>Reels</h3>
            </div>
          </div>
        </div>
        <div>
          <div>
            <div>
              <div role="grid" aria-label="Reels">
                <div role="row">
                  <div>
                    <div role="gridcell"><a role="link" aria-label="Reel by a creator" href="/reel/555/?s=ifu">a reel tile</a></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!--
        Over-blocking control: a feed card with a carousel at the same depth that is not Reels.
        Facebook labels its carousels by what they hold; only "Reels" is short-form video.
      -->
      <div id="keep-people-shelf-card">
        <div><span id="keep-people-shelf-header">People you may know</span></div>
        <div>
          <div>
            <div>
              <div role="grid" aria-label="People you may know">
                <div role="row"><div role="gridcell"><a href="/someone">Someone</a></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div role="article" id="reel-article"><a href="/reel/123">a reel</a></div>
      <div role="article" id="keep-article">A normal status update</div>
      <div role="article" id="keep-lookalike-article">
        <a href="/reeling-in-the-years/posts/1">Reeling In The Years posted an update</a>
      </div>
    </main>
  </body>
</html>
