<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still showcase frames</title>
<!-- Store and social images for Still 2.1. Every picture inside a frame is a real capture of Still,
     or of a site with Still off and then on (capture.mjs, or Safari per SIMULATOR-CAPTURE.md); other
     people's content is blurred at capture time. render-frames.mjs sizes the page for one entry of
     frames.json and calls render(entry). Units: 1u = 1% of the canvas's shorter side. -->
<style>
  @font-face { font-family: Inter; src: url("../../../../assets/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --blue: #2a47e8; --blue-hi: #3d5cff; --blue-lo: #1a33c4; --ink: #0b1430; --u: 8px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; width: 100vw; height: 100vh; }
  body { font-family: Inter, system-ui, sans-serif; color: white; position: relative;
    background: radial-gradient(130% 90% at 15% 0%, var(--blue-hi) 0%, var(--blue) 48%, var(--blue-lo) 100%); }
  .abs { position: absolute; }

  .brand { position: absolute; display: flex; align-items: center; gap: calc(var(--u) * .9); font-weight: 650;
    letter-spacing: -.05em; font-size: calc(var(--u) * 3.4); }
  .brand i { width: calc(var(--u) * 3.9); height: calc(var(--u) * 3.9); border-radius: calc(var(--u) * 1.05); background: white;
    display: grid; place-items: center; }
  .brand i::before { content: ""; width: 52%; height: 0; border-bottom: calc(var(--u) * .28) solid var(--blue); position: relative; top: 8%; }
  .brand i::after { content: ""; position: absolute; width: calc(var(--u) * .45); height: calc(var(--u) * .45); border-radius: 50%;
    background: var(--blue); transform: translate(-10%, -25%); }

  h1 { font-weight: 780; letter-spacing: -.045em; line-height: 1.02; color: rgba(255,255,255,.7); }
  h1 b { color: white; font-weight: 800; }
  .sub { color: rgba(255,255,255,.86); font-weight: 450; line-height: 1.35; letter-spacing: -.01em; }
  .sub b { color: white; font-weight: 650; }

  .pill { display: inline-flex; align-items: center; gap: .55em; background: white; color: var(--ink); border-radius: 999px;
    font-weight: 650; letter-spacing: -.01em; padding: .42em .95em .42em .75em; box-shadow: 0 .3em 1.2em rgba(6,15,70,.25); }
  .pill::before { content: ""; width: .62em; height: .62em; border-radius: 50%; background: var(--accent, #999); box-shadow: 0 0 0 .22em color-mix(in srgb, var(--accent) 22%, transparent); }

  .pill.logo { padding: .55em 1.05em; }
  .pill.logo::before { display: none; }
  .pill.logo { gap: .45em; }
  .pill.logo img { display: block; height: 1.25em; width: auto; }
  .pill.logo img[src*="instagram-wordmark"] { height: 1.5em; margin-top: .15em; }
  .pill.logo img[src*="facebook"] { height: 1.05em; }
  .pill.logo img[src*="tiktok"] { height: 1.45em; }
  .label { font-weight: 720; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.7); white-space: nowrap; }
  .label.good { color: white; }

  .shot { position: absolute; overflow: hidden; background: white; box-shadow: 0 1.6em 3.6em rgba(6,15,70,.38); }
  .shot img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; max-width: none; }

  .phone { position: absolute; background: #0a0d18; box-shadow: 0 2em 4.5em rgba(6,15,70,.45), inset 0 0 0 .18em #2a2f45; }
  .phone .screen { position: absolute; overflow: hidden; background: white; }
  .phone .island { position: absolute; left: 50%; transform: translateX(-50%); background: #05070d; border-radius: 999px; z-index: 3; }

  .check { display: inline-block; width: 1em; height: 1em; margin-right: .35em; vertical-align: -.12em; }
</style>
</head>
<body>
<script>
// Each service is named by its own logo at the top (owner decision), so a glance says which site Still
// is changing; the canvas stays Still blue. Sources are listed in logos/README.md.
const SERVICES = {
  youtube: { domain: "youtube.com", accent: "#ff0033", logo: ["logos/youtube.svg"] },
  "m.youtube": { domain: "m.youtube.com", accent: "#ff0033", logo: ["logos/youtube.svg"] },
  instagram: { domain: "instagram.com", accent: "#e1306c", logo: ["logos/instagram-glyph.svg", "logos/instagram-wordmark.svg"] },
  facebook: { domain: "facebook.com", accent: "#0866ff", logo: ["logos/facebook.svg"] },
  tiktok: { domain: "tiktok.com", accent: "#25f4ee", logo: ["logos/tiktok.svg"] },
};
const CHECK = `<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>`;
const md = (s = "") => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

function el(tag, cls, style = {}, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.assign(e.style, style);
  if (html !== undefined) e.innerHTML = html;
  document.body.appendChild(e);
  return e;
}

// A capture shown inside a box: `crop` is {x, y, w} in the capture's CSS pixels (its left, top and
// visible width); the height follows from the box. `scale` is the capture's pixel density.
function shot(src, box, { crop = {}, radius = 0, cls = "shot", parent } = {}) {
  const s = document.createElement("div");
  s.className = cls;
  Object.assign(s.style, { left: box.x + "px", top: box.y + "px", width: box.w + "px", height: box.h + "px", borderRadius: radius + "px" });
  const img = new Image();
  img.src = src;
  img.onload = () => {
    const density = crop.density || 2;
    const natW = img.naturalWidth / density;
    const k = box.w / (crop.w || natW);
    Object.assign(img.style, { width: natW * k + "px", left: -(crop.x || 0) * k + "px", top: -(crop.y || 0) * k + "px" });
  };
  s.appendChild(img);
  (parent || document.body).appendChild(s);
  return s;
}

// A CSS iPhone: the screen keeps the capture's own aspect (393x852 points).
function phone(src, { x, y, w, crop, rotate = 0 }) {
  const h = w * 2.06, bez = w * 0.035;
  const p = el("div", "phone", { left: x + "px", top: y + "px", width: w + "px", height: h + "px", borderRadius: w * 0.16 + "px", transform: `rotate(${rotate}deg)` });
  const screen = document.createElement("div");
  screen.className = "screen";
  Object.assign(screen.style, { left: bez + "px", top: bez + "px", right: bez + "px", bottom: bez + "px", borderRadius: w * 0.13 + "px" });
  p.appendChild(screen);
  const island = document.createElement("div");
  island.className = "island";
  Object.assign(island.style, { top: bez + w * 0.03 + "px", width: w * 0.3 + "px", height: w * 0.085 + "px" });
  p.appendChild(island);
  const sw = w - bez * 2;
  shot(src, { x: 0, y: 0, w: sw, h: h - bez * 2 }, { crop: { density: 3, ...crop }, parent: screen });
  return p;
}

function brand(W, H, u, pos = "tr") {
  const b = el("div", "brand", { fontSize: u * 3.4 + "px" }, "<i></i>st.ll");
  if (pos === "tr") Object.assign(b.style, { right: u * 5 + "px", top: u * 4.4 + "px" });
  else Object.assign(b.style, { left: u * 6 + "px", bottom: u * 4 + "px" });
  return b;
}

function pill(service, u, size = 2.4) {
  const s = SERVICES[service];
  const p = el("div", "pill", { fontSize: u * size + "px", "--accent": s.accent });
  p.style.setProperty("--accent", s.accent);
  if (s.logo) {
    p.classList.add("logo");
    for (const src of s.logo) {
      const img = new Image();
      img.src = src;
      img.alt = s.domain;
      p.appendChild(img);
    }
  } else p.textContent = s.domain;
  return p;
}

function heading(e, u, { x, y, w, size, subSize, align = "left" }) {
  const h = el("h1", "", { position: "absolute", left: x + "px", top: y + "px", width: w + "px", fontSize: size + "px", textAlign: align }, md(e.headline));
  let bottom = y + h.offsetHeight;
  if (e.subline) {
    const s = el("p", "sub", { position: "absolute", left: x + "px", top: bottom + u * 1.6 + "px", width: w + "px", fontSize: subSize + "px", textAlign: align }, md(e.subline));
    bottom = bottom + u * 1.6 + s.offsetHeight;
  }
  return bottom;
}

const label = (text, good, u, x, y, size = 1.9) =>
  el("div", "label" + (good ? " good" : ""), { position: "absolute", left: x + "px", top: y + "px", fontSize: u * size + "px" }, (good ? CHECK : "") + text);

const LAYOUTS = {
  // Landscape before/after: headline top left, domain pill, two captures rising from the bottom edge.
  split(e, W, H, u) {
    brand(W, H, u);
    const pad = u * 7;
    const p = pill(e.service, u, 2.2);
    Object.assign(p.style, { position: "absolute", left: pad + "px", top: u * 5.5 + "px" });
    const bottom = heading(e, u, { x: pad, y: u * 5.5 + p.offsetHeight + u * 2.4, w: W * 0.72, size: u * 7, subSize: u * 2.6 });
    const top = bottom + u * 7;
    const gap = u * 3.2, cw = (W - pad * 2 - gap) / 2;
    const [before, after] = e.captures;
    label(e.labels?.[0] ?? "Without Still", false, u, pad, top - u * 3.4);
    label(e.labels?.[1] ?? "With Still", true, u, pad + cw + gap, top - u * 3.4);
    const box = (x) => ({ x, y: top, w: cw, h: H - top + u * 3 });
    shot(before.src, box(pad), { crop: before.crop, radius: u * 2.2 });
    shot(after.src, box(pad + cw + gap), { crop: after.crop, radius: u * 2.2 });
  },

  // Portrait before/after on two phones: "before" tilted behind on the left, "after" in front on the right.
  "phone-duo"(e, W, H, u) {
    brand(W, H, u);
    const pad = u * 7;
    const p = pill(e.service, u, 3);
    Object.assign(p.style, { position: "absolute", left: pad + "px", top: u * 9 + "px" });
    const bottom = heading(e, u, { x: pad, y: u * 9 + p.offsetHeight + u * 3.2, w: W - pad * 2, size: u * 11.5, subSize: u * 4.2 });
    const top = bottom + u * 16;
    const [before, after] = e.captures;
    const bw = W * 0.56, aw = W * 0.6;
    label(e.labels?.[0] ?? "Without Still", false, u, pad, top - u * 8, 3.4);
    label(e.labels?.[1] ?? "With Still", true, u, W - pad - u * 30, top - u * 2, 3.4);
    phone(before.src, { x: pad - u * 4, y: top, w: bw, crop: before.crop, rotate: -4 });
    phone(after.src, { x: W - aw - pad + u * 5, y: top + u * 6, w: aw, crop: after.crop, rotate: 3 });
  },

  // One large phone whose screen wipes from "before" (left) to "after" (right) along a divider.
  "phone-split"(e, W, H, u) {
    brand(W, H, u);
    const pad = u * 7;
    const p = pill(e.service, u, 3);
    Object.assign(p.style, { position: "absolute", left: pad + "px", top: u * 9 + "px" });
    const bottom = heading(e, u, { x: pad, y: u * 9 + p.offsetHeight + u * 3.2, w: W - pad * 2, size: u * 11.5, subSize: u * 4.2 });
    const pw = W * 0.8, top = bottom + u * 14, x = (W - pw) / 2;
    const [before, after] = e.captures;
    const ph = phone(after.src, { x, y: top, w: pw, crop: after.crop });
    const screen = ph.querySelector(".screen");
    // The "before" layer, clipped to the left of a slightly slanted divider.
    const left = e.split ?? 0.5, slant = 4;
    const layer = document.createElement("div");
    Object.assign(layer.style, { position: "absolute", inset: 0, clipPath: `polygon(0 0, ${left * 100 + slant}% 0, ${left * 100 - slant}% 100%, 0 100%)` });
    screen.appendChild(layer);
    const sw = screen.clientWidth, sh = screen.clientHeight;
    shot(before.src, { x: 0, y: 0, w: sw, h: sh }, { crop: { density: 3, ...before.crop }, parent: layer });
    const line = document.createElement("div");
    Object.assign(line.style, { position: "absolute", top: "-5%", height: "110%", width: u * 0.9 + "px", left: `calc(${left * 100}% - ${u * 0.45}px)`,
      background: "white", transform: `rotate(${Math.atan((slant * 2 / 100) * sw / sh) * 180 / Math.PI}deg)`, boxShadow: "0 0 1.5em rgba(6,15,70,.45)", zIndex: 2 });
    screen.appendChild(line);
    const knob = document.createElement("div");
    Object.assign(knob.style, { position: "absolute", left: `calc(${left * 100}% - ${u * 5}px)`, top: `calc(50% - ${u * 5}px)`, width: u * 10 + "px", height: u * 10 + "px",
      borderRadius: "50%", background: "white", zIndex: 3, display: "grid", placeItems: "center", color: "var(--blue)", fontSize: u * 4 + "px", fontWeight: 800,
      boxShadow: "0 .4em 1.4em rgba(6,15,70,.35)" });
    knob.textContent = "‹ ›";
    screen.appendChild(knob);
    label(e.labels?.[0] ?? "Without Still", false, u, x, top - u * 6.5, 3.2);
    const good = label(e.labels?.[1] ?? "With Still", true, u, 0, top - u * 6.5, 3.2);
    good.style.left = x + pw - good.offsetWidth + "px";
  },

  // One surface's own UI: a device or card, with the headline and short proof lines.
  surface(e, W, H, u) {
    const landscape = W > H;
    const [ui] = e.captures;
    if (landscape) {
      // Still's own UI carries the logo here, so no separate brand mark.
      const pad = u * 7;
      heading(e, u, { x: pad, y: H * 0.3, w: W * 0.5, size: u * 7.8, subSize: u * 2.9 });
      const cw = W * 0.34, ch = ui.crop?.h ? cw * ui.crop.h / ui.crop.w : H;
      shot(ui.src, { x: W - pad - cw, y: Math.max(u * 6, (H - ch) / 2), w: cw, h: ch }, { crop: { density: 3, ...ui.crop }, radius: u * 2.4 });
    } else {
      brand(W, H, u);
      const pad = u * 7;
      const bottom = heading(e, u, { x: pad, y: u * 12, w: W - pad * 2, size: u * 11.5, subSize: u * 4.2 });
      const pw = W * 0.72;
      phone(ui.src, { x: pad - u * 2, y: bottom + u * 10, w: pw, crop: ui.crop });
      // Enlarged rows from the same capture, breaking out of the phone.
      if (e.breakout) {
        const b = e.breakout, bw = W * 0.74;
        shot(ui.src, { x: W - bw - u * 3, y: bottom + u * 10 + pw * b.at, w: bw, h: bw * b.crop.h / b.crop.w },
          { crop: { density: 3, ...b.crop }, radius: u * 3.2 });
      }
    }
  },

  // Instagram feed post (4:5): big hook, one before/after stacked in a single card pair.
  "ig-split"(e, W, H, u) {
    brand(W, H, u);
    const pad = u * 7;
    const p = pill(e.service, u, 2.8);
    Object.assign(p.style, { position: "absolute", left: pad + "px", top: u * 7 + "px" });
    const bottom = heading(e, u, { x: pad, y: u * 7 + p.offsetHeight + u * 2.8, w: W - pad * 2, size: u * 9, subSize: u * 3.6 });
    const gap = u * 3, top = bottom + u * 8, cw = (W - pad * 2 - gap) / 2;
    const [before, after] = e.captures;
    label(e.labels?.[0] ?? "Without Still", false, u, pad, top - u * 4.6, 2.6);
    label(e.labels?.[1] ?? "With Still", true, u, pad + cw + gap, top - u * 4.6, 2.6);
    shot(before.src, { x: pad, y: top, w: cw, h: H - top + u * 3 }, { crop: before.crop, radius: u * 2.6 });
    shot(after.src, { x: pad + cw + gap, y: top, w: cw, h: H - top + u * 3 }, { crop: after.crop, radius: u * 2.6 });
  },
};

window.render = (e) => {
  document.body.textContent = "";
  const W = innerWidth, H = innerHeight, u = Math.min(W, H) / 100;
  document.documentElement.style.setProperty("--u", u + "px");
  LAYOUTS[e.layout](e, W, H, u);
};
</script>
</body>
</html>
