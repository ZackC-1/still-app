<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Still · UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html,body{margin:0;min-height:100%}body{background:var(--surface-raised);font-family:var(--font-ui);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--still-blue)}a:hover{color:var(--still-blue-pressed)}
.kit-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:13px;color:var(--ink-secondary)}
.kit-bar button{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.kit-bar button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kit-bar .sp{flex:1}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:8px 16px 40px}
.frame{position:relative;overflow:hidden;transform:translateZ(0);background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--border)}
.frame.popup{width:380px;min-height:428px}.frame.page{width:100%;max-width:720px;min-height:640px}
.frame.pl{width:100%;max-width:720px}
</style></head><body><div id="root"></div>
<script type="text/babel" src="PopupScreen.babel"></script>
<script type="text/babel" src="SettingsScreen.babel"></script>
<script type="text/babel" src="SignInSheet.babel"></script>
<script type="text/babel">
window.KIT_PURPOSES = [{ name: 'Email', text: '[Approved purpose text: how your email is used with your usage data]' }, { name: 'Usage analytics', text: '[Provider]: which settings are used, so they can be improved.' }, { name: 'AI processing', text: '[Provider]: [approved purpose text]' }];
function App() {
  const [surface, setSurface] = React.useState(localStorage.getItem('still-kit-surface') === 'page' ? 'page' : 'popup');
  const [theme, setTheme] = React.useState('light');
  const [on, setOn] = React.useState(true);
  const [svc, setSvcAll] = React.useState({ youtube: true, instagram: true, tiktok: true, facebook: true });
  const access = { yt_related: 'locked', yt_endscreen: 'locked', yt_autoplay: 'locked', yt_comments: 'locked', yt_livechat: 'locked', ig_explore: 'locked', ig_stories: 'locked', ig_suggested: 'locked', ig_threads: 'locked', fb_stories: 'locked', fb_videos: 'locked', sidebar_ads: 'locked' };
  const [open, setOpen] = React.useState(null);
  const [share, setShare] = React.useState(false);
  const [consentAsked, setConsentAsked] = React.useState(false);
  const [signedIn, setSignedIn] = React.useState(false);
  const [email, setEmail] = React.useState('');
  const [sheet, setSheet] = React.useState(false);
  React.useEffect(() => { localStorage.setItem('still-kit-surface', surface); }, [surface]);
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  const app = { on, setOn, svc, setSvc: (k, v) => setSvcAll(s => ({ ...s, [k]: v })), access, open, setOpen, share, setShare, consentAsked, answerConsent: v => { setShare(v); setConsentAsked(true); },
    signedIn, email, openSignIn: () => setSheet(true), signOut: () => { setSignedIn(false); setEmail(''); }, goSettings: () => setSurface('page') };
  const tab = (id, label) => <button aria-pressed={surface === id} onClick={() => setSurface(id)}>{label}</button>;
  return (
    <>
      <div className="kit-bar">{tab('popup', 'Browser popup')}{tab('page', 'Settings page')}<span className="sp"></span>
        <button aria-pressed={theme === 'dark'} onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}>Dark</button></div>
      <div className="stage">
        {(
          <div className={'frame ' + surface}>
            {surface === 'popup' ? <PopupScreen app={app} /> : <SettingsScreen app={app} />}
            <div className="still-ui"><SignInSheet open={sheet} onClose={() => setSheet(false)} onSignedIn={e => { setEmail(e); setSignedIn(true); setSheet(false); }} /></div>
          </div>
        )}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
