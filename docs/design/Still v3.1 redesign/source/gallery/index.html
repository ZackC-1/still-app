<style>
html,body{margin:0}body{background:#e9ebf2;color:#0b1430;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#2a47e8}a:hover{color:#1e37c2}
.g-wrap{max-width:1240px;margin:0 auto;padding:40px 32px 80px;display:flex;flex-direction:column;gap:48px}
.g-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.g-top h1{margin:0;font-size:28px;letter-spacing:-.02em}
.g-top p{margin:4px 0 0;color:#4a5170;font-size:14px;max-width:62ch}

.g-sec{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.g-sec{grid-template-columns:minmax(0,1fr)}}
.g-meta h2{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
.g-meta .id{font-size:11px;font-weight:600;color:#4a5170;letter-spacing:.04em;margin:0 0 4px}
.g-meta p,.g-meta li{font-size:13px;line-height:1.45;color:#4a5170;margin:0}
.g-meta ul{margin:8px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:4px}
.g-meta code{font-size:12px;background:#fff;border-radius:4px;padding:0 4px}
.g-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}

.g-frame[data-theme="dark"]{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.focus-demo{outline:2px solid var(--focus-ring);outline-offset:3px}
