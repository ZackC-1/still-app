<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}.row{display:flex;gap:12px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:12px}.n{font-size:13px;font-weight:600}.v{font-size:12px;color:var(--ink-secondary);font-variant-numeric:tabular-nums}.lab{font-size:12px;color:var(--ink-secondary)}</style></head><body><div class="row" style="align-items:center;gap:40px;padding:28px"><div class="sw" style="flex:none;align-items:flex-start"><div style="width:25px;height:25px;border-radius:999px;background:#fff;box-shadow:var(--shadow-knob);margin:10px"></div><div class="n">shadow-knob</div><div class="v">0 1px 3px rgba(0,0,0,.18)</div></div><div class="sw" style="flex:none"><div style="width:220px;height:48px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--ink-secondary);box-shadow:var(--shadow-float)"></div><div class="n">shadow-float</div><div class="v">0 6px 24px rgba(0,0,0,.25) · floating notice</div></div><div class="sw" style="flex:none"><div style="width:140px;height:48px;border-radius:12px;background:var(--surface-raised)"></div><div class="n">Cards</div><div class="v">fill only, no border, no shadow</div></div></div></body></html>
