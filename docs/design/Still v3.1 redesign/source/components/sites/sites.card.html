<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}.lbl{font-size:11px;color:var(--ink-secondary);letter-spacing:.02em;margin:0 0 6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const DS = window.StillDesignSystem_c8e8ab;
const { SiteSection, SiteList } = DS;
const acc = { yt_related: 'purchased', yt_endscreen: 'purchased', yt_autoplay: 'purchased', yt_comments: 'purchased', yt_livechat: 'purchased' };
function Card() {
  const [open, setOpen] = React.useState('youtube');
  const [v, setV] = React.useState({ youtube: true, instagram: true, facebook: true, tiktok: true, yt_comments: true });
  const set = (id, x) => setV(s => ({ ...s, [id]: x }));
  const sec = k => <SiteSection key={k} service={k} coreOn={v[k]} onCoreChange={x => set(k, x)} values={v} access={acc} onControlChange={set} open={open === k} onToggleOpen={() => setOpen(open === k ? null : k)} />;
  return (<div className="still-ui" style={{padding:16,display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:16,alignItems:'start'}}>
    <div><p className="lbl">Comfortable · one open · Pro purchased</p><SiteList>{['youtube','instagram','tiktok'].map(sec)}</SiteList></div>
    <div><p className="lbl">Global Off · choices kept</p><SiteList paused><SiteSection service="youtube" coreOn paused open values={{yt_comments:true}} access={acc} showSubs={false} /><SiteSection service="tiktok" coreOn paused /></SiteList></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
